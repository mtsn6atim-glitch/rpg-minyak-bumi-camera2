```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>TEST KAMERA RPG</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#06182c;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  font-size:24px;
}

video{
  width:100%;
  max-width:500px;
  height:auto;
  min-height:300px;
  background:#000;
  border-radius:20px;
  object-fit:cover;
}

button{
  width:100%;
  max-width:500px;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:15px;
  background:#20c7e8;
  color:#06182c;
  font-size:18px;
  font-weight:bold;
}

#status{
  max-width:500px;
  margin:15px auto;
  padding:15px;
  background:#173957;
  border-radius:12px;
  text-align:left;
  line-height:1.6;
}

#error{
  color:#ff7676;
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<h1>📷 TEST KAMERA RPG</h1>

<video
  id="video"
  autoplay
  muted
  playsinline
  webkit-playsinline>
</video>

<div id="status">
  Tekan tombol untuk mengaktifkan kamera.
</div>

<div id="error"></div>

<button onclick="openCamera()">
  📷 AKTIFKAN KAMERA
</button>

<script>

async function openCamera(){

  const status =
    document.getElementById('status');

  const error =
    document.getElementById('error');

  const video =
    document.getElementById('video');

  error.textContent = '';

  status.innerHTML =
    '⏳ Memeriksa kemampuan kamera...';


  console.log(
    'isSecureContext:',
    window.isSecureContext
  );

  console.log(
    'mediaDevices:',
    navigator.mediaDevices
  );


  if(!window.isSecureContext){

    status.innerHTML =
      '❌ HALAMAN TIDAK SECURE (HTTPS)';

    return;
  }


  if(!navigator.mediaDevices){

    status.innerHTML =
      '❌ navigator.mediaDevices tidak tersedia';

    return;
  }


  if(!navigator.mediaDevices.getUserMedia){

    status.innerHTML =
      '❌ getUserMedia tidak tersedia';

    return;
  }


  try{

    status.innerHTML =
      '📷 Meminta izin kamera...';


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:true,

        audio:false

      });


    console.log(
      'STREAM:',
      stream
    );


    video.srcObject =
      stream;


    await video.play();


    status.innerHTML =
      '✅ KAMERA BERHASIL AKTIF!<br><br>' +

      'Resolusi: ' +
      video.videoWidth +
      ' × ' +
      video.videoHeight;


  }

  catch(err){

    console.error(
      'CAMERA ERROR:',
      err
    );


    status.innerHTML =
      '❌ KAMERA GAGAL DIBUKA';


    error.textContent =
      'Nama error: ' +
      err.name +
      '\n\n' +

      'Pesan: ' +
      err.message;


  }

}

</script>

</body>
</html>
```
